<!DOCTYPE html>
<html lang="bs">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Lager majica
  </title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <style>
   * {
  box-sizing:border-box
}
body {
  margin:0;
  padding:16px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033
}
.container {
  max-width:1000px;
  margin:auto
}
h1 {
  text-align:center;
  color:#17365d;
  margin-bottom:8px
}
.subtitle {
  text-align:center;
  color:#64748b;
  margin-bottom:24px
}
.panel {
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0000000d
}
.form-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
label {
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px
}
input {
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:7px;
  font-size:16px
}
button {
  padding:11px 15px;
  border:0;
  border-radius:7px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer
}
button:disabled {
  opacity:.6;
  cursor:wait
}
.primary {
  background:#1769aa;
  color:white
}
.secondary {
  background:#e2e8f0;
  color:#172033
}
.danger {
  background:#dc2626;
  color:white
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px
}
.search {
  margin-bottom:15px
}
.summary {
  font-size:17px;
  font-weight:bold;
  margin-bottom:15px
}
.table-wrap {
  overflow-x:auto
}
table {
  width:100%;
  border-collapse:collapse;
  background:white
}
th,td {
  padding:12px 10px;
  border-bottom:1px solid #e2e8f0;
  text-align:left
}
th {
  background:#edf2f7;
  white-space:nowrap
}
td {
  overflow-wrap:anywhere
}
.quantity {
  font-weight:bold;
  font-size:17px
}
#status {
  padding:12px;
  margin-bottom:16px;
  border-radius:7px;
  background:#e2e8f0;
  overflow-wrap:anywhere
}
.hidden {
  display:none!important
}
.small-actions {
  display:flex;
  gap:6px;
  flex-wrap:wrap
}
.userbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap
}
.muted {
  color:#64748b;
  font-size:14px
}
.auth-box {
  max-width:460px;
  margin:auto
}
@media(max-width:600px) {
  body {
    padding:10px
  }
  .panel {
    padding:14px
  }
  .form-grid {
    grid-template-columns:1fr
  }
  th,td {
    padding:9px 7px;
    font-size:13px
  }
  button {
    padding:10px
  }
}
  </style>
 </head>
 <body>
  <div class="container">
   <h1>
    LAGER MAJICA
   </h1>
   <p class="subtitle">
    Evidencija stanja i količina
   </p>
   <div aria-live="polite" id="status" role="status">
    Povezujem se sa bazom...
   </div>
   <section class="panel auth-box hidden" id="authPanel">
    <h2 id="authTitle">
     Prijava korisnika
    </h2>
    <form id="authForm">
     <label for="email">
      E-mail adresa
     </label>
     <input autocomplete="email" id="email" required="" type="email"/>
     <label for="password" style="margin-top:14px">
      Lozinka
     </label>
     <input autocomplete="current-password" id="password" minlength="6" required="" type="password"/>
     <div class="actions">
      <button class="primary" id="authSubmit" type="submit">
       Prijavi se
      </button>
      <button class="secondary" id="toggleAuth" type="button">
       Napravi nalog
      </button>
     </div>
    </form>
    <p class="muted" id="authHint">
     Prijavi se postojećim nalogom ili napravi novi.
    </p>
   </section>
   <div class="hidden" id="app">
    <section class="panel userbar">
     <div>
      <strong id="userEmail">
      </strong>
      <div class="muted" id="userRole">
      </div>
     </div>
     <button class="secondary" id="logoutBtn">
      Odjavi se
     </button>
    </section>
    <section class="panel hidden" id="editorPanel">
     <h2 id="formTitle">
      Dodaj majice na lager
     </h2>
     <form id="shirtForm">
      <div class="form-grid">
       <div>
        <label for="model">
         Model majice
        </label>
        <input id="model" placeholder="Npr. Basic" required="" type="text"/>
       </div>
       <div>
        <label for="boja">
         Boja
        </label>
        <input id="boja" placeholder="Npr. Crna" required="" type="text"/>
       </div>
       <div>
        <label for="velicina">
         Veličina
        </label>
        <input id="velicina" placeholder="Npr. M, L, XL" required="" type="text"/>
       </div>
       <div>
        <label for="kolicina">
         Količina
        </label>
        <input id="kolicina" min="0" required="" step="1" type="number" value="0"/>
       </div>
      </div>
      <div class="actions">
       <button class="primary" id="saveBtn" type="submit">
        Sačuvaj majice
       </button>
       <button class="secondary hidden" id="cancelBtn" type="button">
        Odustani od izmjene
       </button>
      </div>
     </form>
    </section>
    <section class="panel">
     <h2>
      Stanje lagera
     </h2>
     <div class="summary" id="summary">
      Ukupno majica: 0
     </div>
     <input class="search" id="search" placeholder="Pretraži model, boju ili veličinu..." type="search"/>
     <div class="table-wrap">
      <table>
       <thead>
        <tr>
         <th>
          Model
         </th>
         <th>
          Boja
         </th>
         <th>
          Veličina
         </th>
         <th>
          Količina
         </th>
         <th class="hidden" id="actionsHeader">
          Akcije
         </th>
        </tr>
       </thead>
       <tbody id="shirtList">
        <tr>
         <td colspan="5">
          Podaci još nisu učitani.
         </td>
        </tr>
       </tbody>
      </table>
     </div>
    </section>
   </div>
  </div>
  <script>
   const SUPABASE_URL="https://uoonawjzquwcqnwqdjbu.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_f4hBY2VssBilS_lL_GR-wQ__bnWwrzj";
const TABLE_NAME="majice";
let db=null,shirts=[],editingId=null,isEditor=false,currentUser=null,authMode="login",sessionRevision=0;
const $=id=>document.getElementById(id);
const setStatus=message=>{
  $("status").textContent=message
}
;
const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[char]);
function resetForm(){
  $("shirtForm").reset();
  $("kolicina").value="0";
  editingId=null;
  $("formTitle").textContent="Dodaj majice na lager";
  $("saveBtn").textContent="Sačuvaj majice";
  $("cancelBtn").classList.add("hidden")
}
function renderShirts(){
  const query=$("search").value.trim().toLowerCase();
  const filtered=shirts.filter(item=>[item.model,item.boja,item.velicina].some(value=>String(value??"").toLowerCase().includes(query)));
  const total=shirts.reduce((sum,item)=>sum+Number(item.kolicina||0),0);
  $("summary").textContent="Ukupno majica: "+total+" | Broj različitih stavki: "+shirts.length;
  const columns=isEditor?5:4;
  if(!filtered.length){
    $("shirtList").innerHTML=`<tr><td colspan="${columns}">Nema pronađenih majica.</td></tr>`;
    return
  }
  $("shirtList").innerHTML=filtered.map(item=>`<tr><td>${escapeHtml(item.model)}</td><td>${escapeHtml(item.boja)}</td><td>${escapeHtml(item.velicina)}</td><td class="quantity">${Number(item.kolicina)}</td>${isEditor?`<td><div class="small-actions"><button class="primary" data-action="edit" data-id="${escapeHtml(item.id)}">Izmijeni</button><button class="danger" data-action="delete" data-id="${escapeHtml(item.id)}">Obriši</button></div></td>`:""}</tr>`).join("")
}
async function loadShirts(){
  if(!db||!currentUser)return;
  const revision=sessionRevision;
  setStatus("Učitavam podatke iz online baze...");
  try{
    const {
      data,error
    }
    =await db.from(TABLE_NAME).select("id, model, boja, velicina, kolicina").order("model",{ascending:true});
    if(error)throw error;
    if(revision!==sessionRevision)return;
    shirts=data||[];
    renderShirts();
    setStatus("Podaci su učitani iz online baze.")
  }
  catch(error){
    if(revision===sessionRevision)setStatus("Greška pri učitavanju: "+error.message)
  }
}
async function applySession(session){
  const revision=++sessionRevision;
  const user=session?.user||null;
  currentUser=user;
  isEditor=false;
  shirts=[];
  resetForm();
  $("app").classList.add("hidden");
  $("authPanel").classList.add("hidden");
  if(!user){
    $("authPanel").classList.remove("hidden");
    setStatus("Prijavi se za pristup lageru.");
    return
  }
  setStatus("Provjeravam korisnička prava...");
  try{
    const {
      data,error
    }
    =await db.from("lager_urednici").select("user_id").eq("user_id",user.id).maybeSingle();
    if(error)throw error;
    if(revision!==sessionRevision)return;
    isEditor=!!data;
    $("userEmail").textContent=user.email||"Prijavljen korisnik";
    $("userRole").textContent=isEditor?"Urednik – pregled i izmjene":"Korisnik – samo pregled";
    $("editorPanel").classList.toggle("hidden",!isEditor);
    $("actionsHeader").classList.toggle("hidden",!isEditor);
    $("app").classList.remove("hidden");
    await loadShirts()
  }
  catch(error){
    if(revision!==sessionRevision)return;
    $("authPanel").classList.remove("hidden");
    setStatus("Ne mogu provjeriti prava pristupa: "+error.message)
  }
}
function showAuthMode(){
  const register=authMode==="register";
  $("authTitle").textContent=register?"Registracija korisnika":"Prijava korisnika";
  $("authSubmit").textContent=register?"Registruj se":"Prijavi se";
  $("toggleAuth").textContent=register?"Već imam nalog":"Napravi nalog";
  $("password").autocomplete=register?"new-password":"current-password";
  $("authHint").textContent=register?"Ako je potvrda e-maila uključena, potvrdi adresu putem poruke koju dobiješ.":"Prijavi se postojećim nalogom ili napravi novi."
}
$("toggleAuth").addEventListener("click",()=>{authMode=authMode==="login"?"register":"login";showAuthMode();setStatus(authMode==="register"?"Unesi podatke za novi nalog.":"Unesi podatke za prijavu.")});
$("authForm").addEventListener("submit",async event=>{event.preventDefault();if(!db)return;const email=$("email").value.trim(),password=$("password").value,register=authMode==="register";$("authSubmit").disabled=true;try{if(register){const {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(data.session){await applySession(data.session)}else{setStatus("Zahtjev za registraciju je primljen. Ako je potrebna potvrda e-maila, provjeri poštu, a zatim se prijavi.");authMode="login";showAuthMode()}}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await applySession(data.session)}$("password").value=""}catch(error){setStatus("Greška pri "+(register?"registraciji":"prijavi")+": "+error.message)}finally{$("authSubmit").disabled=false}});
$("logoutBtn").addEventListener("click",async()=>{const {error}=await db.auth.signOut();if(error)setStatus("Greška pri odjavi: "+error.message);else await applySession(null)});
$("shirtForm").addEventListener("submit",async event=>{event.preventDefault();if(!db||!currentUser||!isEditor){setStatus("Nemaš pravo uređivanja lagera.");return}const model=$("model").value.trim(),boja=$("boja").value.trim(),velicina=$("velicina").value.trim(),kolicina=Number($("kolicina").value);if(!model||!boja||!velicina){setStatus("Popuni sva polja.");return}if(!Number.isSafeInteger(kolicina)||kolicina<0){setStatus("Količina mora biti cijeli broj od nule naviše.");return}$("saveBtn").disabled=true;try{let result;if(editingId!==null){result=await db.from(TABLE_NAME).update({model,boja,velicina,kolicina}).eq("id",editingId).select("id");if(!result.error&&(!result.data||!result.data.length))throw Error("Izmjena nije potvrđena. Provjeri dozvole pristupa.")}else{result=await db.rpc("dodaj_majice",{p_model:model,p_boja:boja,p_velicina:velicina,p_kolicina:kolicina})}if(result.error)throw result.error;resetForm();await loadShirts();setStatus("Podaci su uspješno sačuvani u online bazi.")}catch(error){setStatus("Greška pri čuvanju: "+error.message)}finally{$("saveBtn").disabled=false}});
$("shirtList").addEventListener("click",async event=>{const button=event.target.closest("button[data-action]");if(!button||!db||!currentUser||!isEditor)return;const item=shirts.find(shirt=>String(shirt.id)===String(button.dataset.id));if(!item)return;if(button.dataset.action==="edit"){editingId=item.id;$("model").value=item.model;$("boja").value=item.boja;$("velicina").value=item.velicina;$("kolicina").value=item.kolicina;$("formTitle").textContent="Izmijeni podatke o majicama";$("saveBtn").textContent="Sačuvaj izmjene";$("cancelBtn").classList.remove("hidden");$("shirtForm").scrollIntoView({behavior:"smooth"})}else if(button.dataset.action==="delete"){if(!confirm("Da li sigurno želiš obrisati ovu stavku lagera?"))return;button.disabled=true;try{const {data,error}=await db.from(TABLE_NAME).delete().eq("id",item.id).select("id");if(error)throw error;if(!data||!data.length)throw Error("Brisanje nije potvrđeno. Provjeri dozvole pristupa.");if(String(editingId)===String(item.id))resetForm();await loadShirts();setStatus("Stavka je obrisana iz online baze.")}catch(error){setStatus("Greška pri brisanju: "+error.message)}finally{button.disabled=false}}});
$("cancelBtn").addEventListener("click",resetForm);
$("search").addEventListener("input",renderShirts);
async function initialize(){
  try{
    if(!window.supabase)throw Error("Supabase biblioteka nije učitana.");
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT"){applySession(null)}else if(event==="SIGNED_IN"||event==="INITIAL_SESSION"||event==="USER_UPDATED"){applySession(session)}})
  }
  catch(error){
    setStatus("Greška pri povezivanju: "+error.message)
  }
}
initialize();
  </script>
 </body>
</html>
